name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/regress.cjs
      - run: mkdir _site && cp -r index.html src content music sfx _site/
      # cache busting: after a deploy the browser must never mix old and new scripts
      - run: sed -i -E "s#<script src=\"([^\"?]+)\"#<script src=\"\\1?v=${GITHUB_SHA::8}\"#g" _site/index.html && grep -c "?v=" _site/index.html
      # every script the page loads must exist in the published site (a missing folder once hid GRAZE RUSH)
      - run: grep -oE 'src="[^"?]+' _site/index.html | cut -c6- | while read f; do test -f "_site/$f" || { echo "MISSING $f"; exit 1; }; done
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: _site }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
